<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robo-Fortune Teller 3000</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        /* Floating / Idle Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }

        /* Mouth Lip-syncing Animation */
        @keyframes talkMouth {
            0%, 100% { height: 6px; rx: 3px; }
            50% { height: 28px; rx: 10px; }
        }

        .talking .robot-mouth {
            animation: talkMouth 0.22s infinite alternate ease-in-out;
        }

        /* Eye Blinking */
        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .robot-eye {
            transform-origin: center;
            animation: blink 4s infinite;
        }

        /* Robot Happy Dance */
        @keyframes dance {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            15% { transform: translateY(-25px) rotate(-12deg) scale(1.08); }
            30% { transform: translateY(0) rotate(12deg) scale(0.95); }
            45% { transform: translateY(-20px) rotate(-8deg) scale(1.05); }
            60% { transform: translateY(0) rotate(8deg) scale(0.98); }
            75% { transform: translateY(-15px) rotate(-4deg) scale(1.02); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        .dancing {
            animation: dance 0.8s infinite ease-in-out !important;
        }

        /* Robot Crying & Falling */
        @keyframes fallAndCry {
            0% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-10px) rotate(-5deg); }
            60% { transform: translateY(80px) rotate(85deg); }
            100% { transform: translateY(110px) rotate(90deg); }
        }

        .falling {
            animation: fallAndCry 1.2s forwards cubic-bezier(0.6, -0.28, 0.735, 0.045) !important;
        }

        /* Rocket Launch Animation */
        @keyframes rocketLaunch {
            0% { transform: translateY(0) scale(1); }
            20% { transform: translateY(10px) scale(0.98) rotate(2deg); }
            40% { transform: translateY(-30px) scale(1.05); }
            100% { transform: translateY(-900px) scale(1.5); opacity: 0; }
        }

        .launching {
            animation: rocketLaunch 2.2s ease-in forwards !important;
        }

        /* Smoke Particles */
        .smoke-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            pointer-events: none;
            animation: expandSmoke 2s forwards ease-out;
        }

        @keyframes expandSmoke {
            0% { transform: scale(0.2); opacity: 0.9; }
            50% { opacity: 0.8; }
            100% { transform: scale(4.5); opacity: 0; }
        }

        .tear-drop {
            position: absolute;
            width: 10px;
            height: 16px;
            background: #38bdf8;
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            animation: tearFall 1s infinite linear;
        }

        @keyframes tearFall {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            100% { transform: translateY(100px) scale(1.2); opacity: 0; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        #qrcode canvas, #qrcode img {
            margin: 0 auto;
            border-radius: 12px;
            padding: 8px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-between p-4 sm:p-6 select-none">

    <!-- Header / Nav bar -->
    <header class="w-full max-w-4xl flex flex-col sm:flex-row justify-between items-center z-20 mb-2 gap-3">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-indigo-600/60 rounded-xl border border-indigo-400/40">
                <i class="fa-solid fa-robot text-yellow-300 text-2xl sm:text-3xl"></i>
            </div>
            <h1 class="text-xl sm:text-3xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-300 to-cyan-300">
                Robo-Fortune 3000
            </h1>
        </div>

        <div class="flex items-center space-x-2">
            <!-- QR Code Trigger Button -->
            <button onclick="openQRModal()" class="px-4 py-2 rounded-full glass-card hover:bg-white/20 transition-all flex items-center space-x-2 text-sm sm:text-base border border-yellow-400/50 text-yellow-300 shadow-lg hover:scale-105">
                <i class="fa-solid fa-qrcode"></i>
                <span class="font-semibold">Get QR Code</span>
            </button>

            <!-- Audio Toggle Button -->
            <button id="soundToggle" onclick="toggleAudio()" class="px-4 py-2 rounded-full glass-card hover:bg-white/20 transition-all flex items-center space-x-2 text-sm sm:text-base border border-indigo-300/30">
                <i id="soundIcon" class="fa-solid fa-volume-high text-cyan-300"></i>
                <span id="soundText" class="font-semibold text-cyan-100">Sound ON</span>
            </button>
        </div>
    </header>

    <main class="w-full max-w-3xl flex flex-col items-center justify-center flex-grow z-10 relative">
        
        <!-- Speech Bubble Container -->
        <div id="speechBubble" class="glass-card w-full max-w-xl p-5 sm:p-6 rounded-3xl mb-6 relative text-center border-2 border-cyan-400/50 shadow-2xl transition-all duration-300 transform">
            <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[16px] border-l-transparent border-r-[16px] border-r-transparent border-t-[18px] border-t-cyan-500/40"></div>
            <p id="robotSpeechText" class="text-lg sm:text-2xl font-semibold text-yellow-200 leading-snug tracking-wide">
                Bleep Bloop! Greetings human!
            </p>
        </div>

        <!-- Animated SVG Robot -->
        <div id="robotContainer" class="relative my-2 transition-transform duration-500" style="animation: float 3.5s ease-in-out infinite;">
            <!-- Tears Animation Container -->
            <div id="tearsContainer" class="hidden absolute top-20 w-full flex justify-between px-12 z-20">
                <div class="tear-drop left-10"></div>
                <div class="tear-drop right-10" style="animation-delay: 0.3s;"></div>
            </div>

            <!-- SVG Robot Figure -->
            <svg id="robotSVG" width="220" height="240" viewBox="0 0 220 240" class="drop-shadow-[0_15px_25px_rgba(0,0,0,0.6)]">
                <!-- Antenna -->
                <line x1="110" y1="45" x2="110" y2="15" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
                <circle id="antennaOrb" cx="110" cy="12" r="10" fill="#f43f5e" class="animate-pulse"/>
                
                <!-- Head -->
                <rect x="50" y="45" width="120" height="90" rx="24" fill="#334155" stroke="#64748b" stroke-width="4"/>
                <rect x="62" y="57" width="96" height="66" rx="16" fill="#0f172a"/>

                <!-- Eyes -->
                <g id="robotEyes">
                    <circle class="robot-eye" cx="85" cy="85" r="14" fill="#38bdf8"/>
                    <circle class="robot-eye" cx="135" cy="85" r="14" fill="#38bdf8"/>
                    <circle cx="88" cy="82" r="4" fill="#ffffff"/>
                    <circle cx="138" cy="82" r="4" fill="#ffffff"/>
                </g>

                <!-- Mouth / Speaker -->
                <rect id="robotMouth" class="robot-mouth" x="80" y="108" width="60" height="8" rx="4" fill="#f59e0b"/>

                <!-- Neck -->
                <rect x="98" y="135" width="24" height="12" rx="4" fill="#475569"/>

                <!-- Body -->
                <rect x="40" y="147" width="140" height="85" rx="28" fill="#1e293b" stroke="#475569" stroke-width="4"/>
                <rect x="65" y="162" width="90" height="55" rx="14" fill="#0f172a"/>
                
                <!-- Body Gauges/Lights -->
                <circle id="light1" cx="82" cy="180" r="7" fill="#10b981"/>
                <circle id="light2" cx="110" cy="180" r="7" fill="#f59e0b"/>
                <circle id="light3" cx="138" cy="180" r="7" fill="#ec4899"/>
                
                <rect x="80" y="198" width="60" height="8" rx="4" fill="#334155"/>

                <!-- Arms -->
                <path d="M 38 160 Q 15 180 28 205" stroke="#64748b" stroke-width="10" stroke-linecap="round" fill="none"/>
                <path d="M 182 160 Q 205 180 192 205" stroke="#64748b" stroke-width="10" stroke-linecap="round" fill="none"/>
                <circle cx="28" cy="205" r="8" fill="#cbd5e1"/>
                <circle cx="192" cy="205" r="8" fill="#cbd5e1"/>
            </svg>
        </div>

        <!-- Interactive Dynamic Action Area -->
        <div id="actionArea" class="w-full mt-4 flex flex-col items-center z-20">
            <!-- Dynamic button views rendered via JavaScript -->
        </div>
    </main>

    <!-- QR Code Modal Popup -->
    <div id="qrModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md animate-fade-in">
        <div class="glass-card max-w-sm w-full p-6 rounded-3xl border-2 border-yellow-400/60 shadow-2xl relative text-center bg-slate-900/90">
            <!-- Close Button -->
            <button onclick="closeQRModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="flex justify-center mb-3 text-yellow-300 text-3xl">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <h3 class="text-xl font-bold text-yellow-200 mb-1">Scan QR Code</h3>
            <p class="text-xs text-indigo-200 mb-4">Scan with your mobile device to open this Fortune Teller app live!</p>

            <!-- QR Container -->
            <div id="qrcode" class="my-4 flex justify-center min-h-[160px] items-center"></div>

            <!-- Editable URL Input -->
            <div class="mt-4 flex flex-col gap-2">
                <label class="text-xs text-indigo-300 text-left font-semibold">Page URL / Share Link:</label>
                <div class="flex gap-2">
                    <input id="qrUrlInput" type="text" class="w-full px-3 py-2 text-xs rounded-xl bg-slate-800 border border-slate-600 text-cyan-200 focus:outline-none focus:border-yellow-400" placeholder="https://example.com" />
                    <button onclick="updateQRCode()" class="px-3 py-2 bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold rounded-xl text-xs">
                        Update
                    </button>
                </div>
            </div>

            <button onclick="closeQRModal()" class="mt-5 w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-bold border border-indigo-400/30">
                Close
            </button>
        </div>
    </div>

    <footer class="text-center text-xs sm:text-sm text-indigo-300/70 z-10 py-2">
        <p>Powered by Robo-AI & Rocket Magic 🚀 | Scan QR Code to Play on Mobile!</p>
    </footer>

    <script>
        // --- Application State ---
        const state = {
            currentStep: 'START',
            profession: null,
            selectedRocket: null,
            soundEnabled: true,
            isSpeaking: false,
            speechSynth: window.speechSynthesis,
            synthUtterance: null,
            audioCtx: null,
            qrInstance: null
        };

        // --- Sound Effects Generator (Web Audio API) ---
        function getAudioContext() {
            if (!state.audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                state.audioCtx = new AudioContext();
            }
            if (state.audioCtx.state === 'suspended') {
                state.audioCtx.resume();
            }
            return state.audioCtx;
        }

        function playSound(type) {
            if (!state.soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'launch') {
                    const bufferSize = ctx.sampleRate * 2.5;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(200, now);
                    filter.frequency.linearRampToValueAtTime(1200, now + 1.2);
                    filter.frequency.linearRampToValueAtTime(100, now + 2.5);

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.01, now);
                    gain.gain.linearRampToValueAtTime(0.4, now + 0.5);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start(now);
                    noise.stop(now + 2.5);
                } else if (type === 'fanfare') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, index) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + index * 0.12);
                        gain.gain.setValueAtTime(0.2, now + index * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.12 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + index * 0.12);
                        osc.stop(now + index * 0.12 + 0.3);
                    });
                } else if (type === 'cry') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.8);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.8);
                }
            } catch (e) {
                console.log('Audio Error:', e);
            }
        }

        // --- Speech Synthesis & Lip Sync ---
        function speak(text, callback) {
            const speechBubble = document.getElementById('robotSpeechText');
            speechBubble.innerText = text;

            if (!state.soundEnabled || !('speechSynthesis' in window)) {
                if (callback) setTimeout(callback, 1500);
                return;
            }

            state.speechSynth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 1.3;
            utterance.rate = 1.05;

            const voices = state.speechSynth.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Robot')));
            if (preferredVoice) utterance.voice = preferredVoice;

            const robotContainer = document.getElementById('robotContainer');

            utterance.onstart = () => {
                state.isSpeaking = true;
                robotContainer.classList.add('talking');
            };

            utterance.onend = () => {
                state.isSpeaking = false;
                robotContainer.classList.remove('talking');
                if (callback) callback();
            };

            utterance.onerror = () => {
                state.isSpeaking = false;
                robotContainer.classList.remove('talking');
                if (callback) callback();
            };

            state.synthUtterance = utterance;
            state.speechSynth.speak(utterance);
        }

        function toggleAudio() {
            state.soundEnabled = !state.soundEnabled;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');

            if (state.soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-cyan-300';
                text.innerText = 'Sound ON';
                getAudioContext();
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-red-400';
                text.innerText = 'Sound OFF';
                if (state.speechSynth) state.speechSynth.cancel();
                document.getElementById('robotContainer').classList.remove('talking');
            }
        }

        // --- QR Code Generator Logic ---
        function openQRModal() {
            playSound('click');
            const modal = document.getElementById('qrModal');
            const urlInput = document.getElementById('qrUrlInput');
            const currentUrl = window.location.href.startsWith('http') ? window.location.href : 'https://example.com/robo-fortune';
            
            urlInput.value = currentUrl;
            modal.classList.remove('hidden');

            renderQRCode(currentUrl);
        }

        function closeQRModal() {
            playSound('click');
            document.getElementById('qrModal').classList.add('hidden');
        }

        function renderQRCode(url) {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; // Clear previous QR

            try {
                state.qrInstance = new QRCode(qrContainer, {
                    text: url,
                    width: 150,
                    height: 150,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (err) {
                console.error("QR Code Error:", err);
                qrContainer.innerHTML = '<p class="text-rose-400 text-xs">Error generating QR Code</p>';
            }
        }

        function updateQRCode() {
            playSound('click');
            const urlInput = document.getElementById('qrUrlInput');
            if (urlInput.value.trim()) {
                renderQRCode(urlInput.value.trim());
            }
        }

        // --- Fortune Data ---
        const fortunes = {
            Student: [
                "🚀 Exam Magic: You will mysteriously remember ALL the correct answers 5 minutes before the exam starts, resulting in an effortless A+!",
                "🎓 Coffee Mastery: Your next cup of coffee will give you 200% extra focus and total immunity to procrastination!",
                "📚 Infinite Luck: Homework will write itself when you sleep, and teachers will give you free bonus points!"
            ],
            Professor: [
                "🍎 Genius Epiphany: You will explain a complex concept so well today that your students will stand up and applaud!",
                "☕ Infinite Mug: Your coffee will stay perfectly hot all day long, and grading papers will feel like playing a fun video game!",
                "🏆 Nobel Vibe: You will solve a long-standing academic debate while eating a sandwich at lunch!"
            ],
            Civilian: [
                "💰 Surprise Windfall: You will find forgotten money in your winter jacket pocket, enough to buy your favorite treats!",
                "🌟 Ultimate Serendipity: Every traffic light you approach today will turn green, and you will win a surprise prize!",
                "👑 Legend Status: A random dog will look at you today like you are the most important person in the universe!"
            ]
        };

        // --- STEP 1: Question 1 ---
        function renderQuestion1() {
            state.currentStep = 'QUESTION_1';
            resetRobotAnimations();

            const actionArea = document.getElementById('actionArea');
            actionArea.innerHTML = `
                <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md animate-fade-in">
                    <button onclick="handleQ1Answer(true)" class="flex-1 py-4 px-6 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-xl rounded-2xl shadow-lg transform hover:-translate-y-1 transition-all border border-emerald-300/30">
                        <i class="fa-solid fa-circle-check mr-2"></i> YES!
                    </button>
                    <button onclick="handleQ1Answer(false)" class="flex-1 py-4 px-6 bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-400 hover:to-red-500 text-white font-bold text-xl rounded-2xl shadow-lg transform hover:-translate-y-1 transition-all border border-rose-300/30">
                        <i class="fa-solid fa-circle-xmark mr-2"></i> NO
                    </button>
                </div>
            `;

            speak("Bleep bloop! Welcome! Would you like to see your future?");
        }

        function handleQ1Answer(answer) {
            playSound('click');
            if (answer) {
                renderQuestion2();
            } else {
                speak("So you don't want to know whether you will become rich or not? Returning to home screen!", () => {
                    setTimeout(() => {
                        renderQuestion1();
                    }, 1200);
                });
            }
        }

        // --- STEP 2: Question 2 (Profession) ---
        function renderQuestion2() {
            state.currentStep = 'QUESTION_2';
            const actionArea = document.getElementById('actionArea');
            
            actionArea.innerHTML = `
                <div class="flex flex-col sm:flex-row gap-3 w-full max-w-lg">
                    <button onclick="handleProfession('Student')" class="flex-1 py-4 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-lg rounded-2xl shadow-lg transform hover:-translate-y-1 transition-all border border-cyan-300/30 flex flex-col items-center">
                        <i class="fa-solid fa-graduation-cap text-3xl mb-1"></i>
                        Student
                    </button>
                    <button onclick="handleProfession('Professor')" class="flex-1 py-4 px-4 bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-400 hover:to-indigo-500 text-white font-bold text-lg rounded-2xl shadow-lg transform hover:-translate-y-1 transition-all border border-purple-300/30 flex flex-col items-center">
                        <i class="fa-solid fa-chalkboard-user text-3xl mb-1"></i>
                        Professor
                    </button>
                    <button onclick="handleProfession('Civilian')" class="flex-1 py-4 px-4 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-bold text-lg rounded-2xl shadow-lg transform hover:-translate-y-1 transition-all border border-amber-300/30 flex flex-col items-center">
                        <i class="fa-solid fa-user-astronaut text-3xl mb-1"></i>
                        Civilian
                    </button>
                </div>
            `;

            speak("Fascinating! Tell me human, what are you?");
        }

        function handleProfession(prof) {
            playSound('click');
            state.profession = prof;
            renderRocketStage();
        }

        // --- STEP 3: Rocket Selection ---
        function renderRocketStage() {
            state.currentStep = 'ROCKET_SELECTION';
            const actionArea = document.getElementById('actionArea');

            actionArea.innerHTML = `
                <div class="w-full text-center">
                    <p class="text-indigo-200 text-sm mb-4 font-semibold uppercase tracking-wider">Pick 1 Mystery Rocket to launch your destiny!</p>
                    <div id="rocketsGrid" class="flex justify-center items-end gap-4 sm:gap-8 min-h-[180px] pt-4">
                        <div id="rocket1" onclick="launchRocket(1)" class="group cursor-pointer flex flex-col items-center transform transition-all hover:scale-110">
                            <div class="text-5xl sm:text-6xl filter drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)] group-hover:animate-bounce">🚀</div>
                            <span class="mt-2 text-xs font-bold px-3 py-1 bg-pink-500/80 rounded-full border border-pink-300/50">Alpha</span>
                        </div>
                        <div id="rocket2" onclick="launchRocket(2)" class="group cursor-pointer flex flex-col items-center transform transition-all hover:scale-110">
                            <div class="text-5xl sm:text-6xl filter drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)] group-hover:animate-bounce" style="filter: hue-rotate(90deg);">🚀</div>
                            <span class="mt-2 text-xs font-bold px-3 py-1 bg-cyan-500/80 rounded-full border border-cyan-300/50">Cosmo</span>
                        </div>
                        <div id="rocket3" onclick="launchRocket(3)" class="group cursor-pointer flex flex-col items-center transform transition-all hover:scale-110">
                            <div class="text-5xl sm:text-6xl filter drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)] group-hover:animate-bounce" style="filter: hue-rotate(200deg);">🚀</div>
                            <span class="mt-2 text-xs font-bold px-3 py-1 bg-amber-500/80 rounded-full border border-amber-300/50">Nova</span>
                        </div>
                    </div>
                </div>
            `;

            speak(`Ah, a distinguished ${state.profession}! Choose 1 mystery rocket to unlock your fortune!`);
        }

        function launchRocket(index) {
            playSound('click');
            playSound('launch');
            state.selectedRocket = index;

            const selectedRocketEl = document.getElementById(`rocket${index}`);
            const rocketsGrid = document.getElementById('rocketsGrid');

            Array.from(rocketsGrid.children).forEach(child => {
                if (child !== selectedRocketEl) {
                    child.style.opacity = '0.3';
                    child.style.pointerEvents = 'none';
                }
            });

            selectedRocketEl.classList.add('launching');

            const rect = selectedRocketEl.getBoundingClientRect();
            createSmokeFX(rect.left + rect.width / 2, rect.top + rect.height / 2);

            speak("Rocket ignition in 3... 2... 1... Blastoff!");

            setTimeout(() => {
                renderFortuneReveal();
            }, 2300);
        }

        function createSmokeFX(x, y) {
            for (let i = 0; i < 18; i++) {
                setTimeout(() => {
                    const smoke = document.createElement('div');
                    smoke.className = 'smoke-particle';
                    const size = Math.random() * 40 + 30;
                    smoke.style.width = `${size}px`;
                    smoke.style.height = `${size}px`;
                    smoke.style.left = `${x + (Math.random() * 80 - 40)}px`;
                    smoke.style.top = `${y + (Math.random() * 60 - 20)}px`;
                    document.body.appendChild(smoke);

                    setTimeout(() => smoke.remove(), 2000);
                }, i * 70);
            }
        }

        // --- STEP 4: Fortune Reveal ---
        function renderFortuneReveal() {
            state.currentStep = 'FORTUNE_REVEAL';
            
            const list = fortunes[state.profession] || fortunes['Civilian'];
            const fortuneText = list[Math.floor(Math.random() * list.length)];

            const actionArea = document.getElementById('actionArea');
            actionArea.innerHTML = `
                <div class="glass-card p-6 rounded-3xl w-full text-center border-2 border-yellow-400/60 shadow-2xl animate-fade-in relative overflow-hidden">
                    <div class="text-yellow-300 text-xs font-bold tracking-widest uppercase mb-2">✨ Fortune Discovered in Rocket Clouds ✨</div>
                    <div class="text-xl sm:text-2xl font-bold text-white mb-6 leading-relaxed">
                        "${fortuneText}"
                    </div>

                    <div class="pt-2 border-t border-white/10">
                        <p class="text-sm text-cyan-200 mb-4 font-medium">Do you believe what the fortune said?</p>
                        <div class="flex justify-center gap-4">
                            <button onclick="handleFinalReaction(true)" class="py-3 px-8 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-bold text-lg rounded-2xl shadow-lg transform hover:scale-105 transition-all border border-emerald-300/40">
                                <i class="fa-solid fa-thumbs-up mr-2"></i> YES! I Believe!
                            </button>
                            <button onclick="handleFinalReaction(false)" class="py-3 px-8 bg-gradient-to-r from-pink-600 to-rose-700 hover:from-pink-500 hover:to-rose-600 text-white font-bold text-lg rounded-2xl shadow-lg transform hover:scale-105 transition-all border border-pink-300/40">
                                <i class="fa-solid fa-thumbs-down mr-2"></i> NO Way
                            </button>
                        </div>
                    </div>
                </div>
            `;

            speak(`Here is your future: ${fortuneText}. Tell me human, do you believe this fortune?`);
        }

        // --- STEP 5: Final Reactions ---
        function handleFinalReaction(believes) {
            playSound('click');
            const robotContainer = document.getElementById('robotContainer');
            const actionArea = document.getElementById('actionArea');

            if (believes) {
                playSound('fanfare');
                robotContainer.classList.add('dancing');

                actionArea.innerHTML = `
                    <div class="text-center animate-bounce mt-2">
                        <span class="text-3xl sm:text-4xl">🎉 🤖 💃 💖 ✨</span>
                        <p class="text-xl font-bold text-yellow-300 mt-2">YAY! Robo-Joy Overload!</p>
                        <button onclick="renderQuestion1()" class="mt-4 px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full text-sm font-semibold border border-indigo-300/40 shadow-lg">
                            <i class="fa-solid fa-rotate-right mr-1"></i> Ask Fortune Again
                        </button>
                    </div>
                `;

                speak("Hooray! Joy circuits overloaded! I knew you would believe! Watch me dance!");

            } else {
                playSound('cry');
                document.getElementById('tearsContainer').classList.remove('hidden');
                robotContainer.classList.add('falling');

                actionArea.innerHTML = `
                    <div class="text-center mt-2">
                        <span class="text-3xl sm:text-4xl">😭 💔 ⚡ 😵</span>
                        <p class="text-xl font-bold text-rose-300 mt-2">System Error: Heart Broken!</p>
                        <button onclick="renderQuestion1()" class="mt-4 px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full text-sm font-semibold border border-indigo-300/40 shadow-lg">
                            <i class="fa-solid fa-wrench mr-1"></i> Repair & Restart
                        </button>
                    </div>
                `;

                speak("Oh no! My predictions are 100 percent accurate! My robotic heart is broken!");
            }
        }

        function resetRobotAnimations() {
            const robotContainer = document.getElementById('robotContainer');
            robotContainer.classList.remove('dancing', 'falling', 'talking');
            document.getElementById('tearsContainer').classList.add('hidden');
        }

        window.onload = () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
            }
            renderQuestion1();
        };
    </script>
</body>
</html>
